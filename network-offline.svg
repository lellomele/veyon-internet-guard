<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sea" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#01579B"/>
    </radialGradient>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Globe sea -->
  <circle cx="32" cy="32" r="26" fill="url(#sea)"/>

  <!-- Continent shapes -->
  <g clip-path="url(#globe-clip)" fill="#43A047" opacity="0.9">
    <ellipse cx="28" cy="26" rx="6" ry="9"/>
    <ellipse cx="20" cy="35" rx="4" ry="7"/>
    <ellipse cx="44" cy="24" rx="9" ry="5"/>
    <ellipse cx="46" cy="36" rx="5" ry="4"/>
  </g>

  <!-- Globe grid lines -->
  <g clip-path="url(#globe-clip)" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.3">
    <ellipse cx="32" cy="32" rx="13" ry="26"/>
    <line x1="6" y1="32" x2="58" y2="32"/>
    <path d="M7 22 Q32 27 57 22"/>
    <path d="M7 42 Q32 37 57 42"/>
  </g>

  <!-- Globe border -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#0D47A1" stroke-width="1.5"/>

  <!-- Prohibition sign -->
  <circle cx="32" cy="32" r="26" fill="#E53935" fill-opacity="0.18" stroke="#E53935" stroke-width="5"/>
  <line x1="13.6" y1="13.6" x2="50.4" y2="50.4"
        stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
</svg>
